/* Boje i fontovi preuzeti sa stranice (css/varijable.css + style.css). */
:root{
  --bg:#171310; --bg-deep:#100d0b; --bg2:#1f1a15; --surface:#262019; --border:#3a3128;
  --text:#f3ede3; --muted:#b9ac98;

}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
body{-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}

/* ---------- tipografija ---------- */

<body>
<div id="stage">
  <div id="bg" class="full">
    <div id="bgbase" class="full"></div>
    <img id="bgPhoto" src="../../slike/hero.jpg" alt="">
    <div id="bgPhotoShade" class="full"></div>
    <div id="grid"></div>
    <div id="blob1" class="blob"></div>
    <div id="blob2" class="blob b2"></div>
    <div id="blob3" class="blob"></div>
    <div id="particles" class="full"></div>
  </div>

  <div id="cam" class="full">
    <!-- 0–2 s: hook -->
    <svg id="bell" viewBox="0 0 200 170" aria-hidden="true">
      <defs>
        <linearGradient id="bellG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f6dca8"/><stop offset=".5" stop-color="#d6ab63"/><stop offset="1" stop-color="#8f6430"/>
        </linearGradient>
      </defs>
      <g id="bellWaves" fill="none" stroke="#d6ab63" stroke-width="7" stroke-linecap="round">
        <path id="wR1" d="M168 70 Q182 92 168 114"/><path id="wR2" d="M186 54 Q208 92 186 130"/>
        <path id="wL1" d="M32 70 Q18 92 32 114"/><path id="wL2" d="M14 54 Q-8 92 14 130"/>
      </g>
      <g id="bellBody">
        <rect x="93" y="24" width="14" height="36" rx="5" fill="url(#bellG)"/>
        <circle cx="100" cy="20" r="13" fill="url(#bellG)"/>
        <path d="M34 134 A66 66 0 0 1 166 134 Z" fill="url(#bellG)"/>
        <path d="M60 112 A44 44 0 0 1 90 80" stroke="rgba(255,255,255,.6)" stroke-width="8" fill="none" stroke-linecap="round"/>
        <rect x="16" y="134" width="168" height="18" rx="9" fill="#b88742"/>
      </g>
    </svg>
    <div id="hook">
      <span class="line"><span class="hw" id="hw1">Gosti</span> <span class="hw" id="hw2">čekaju</span></span>
      <span class="line"><span class="hw" id="hw3">konobara.</span></span>
      <span class="line"><span class="hw" id="hookL3">I odlaze.</span></span>
    </div>

<script>
/* ================= pomoćne funkcije ================= */
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: (p) => p,
  oC: (p) => 1 - (1 - p) ** 3,
  iC: (p) => p * p * p,
  ioC: (p) => (p < 0.5 ? 4 * p * p * p : 1 - (-2 * p + 2) ** 3 / 2),
  oE: (p) => (p >= 1 ? 1 : 1 - 2 ** (-10 * p)),
  iE: (p) => (p <= 0 ? 0 : 2 ** (10 * p - 10)),
  oQ: (p) => 1 - (1 - p) ** 5,
  ioQ: (p) => (p < 0.5 ? 16 * p ** 5 : 1 - (-2 * p + 2) ** 5 / 2),
  oB: (p) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * (p - 1) ** 3 + c1 * (p - 1) ** 2; },
  oB2: (p) => { const c1 = 2.4, c3 = c1 + 1; return 1 + c3 * (p - 1) ** 3 + c1 * (p - 1) ** 2; },
  sp: (p) => (p >= 1 ? 1 : 1 - Math.exp(-6.5 * p) * Math.cos(9.5 * p)),
};
const pr = (t, t0, t1, e = E.lin) => e(clamp((t - t0) / (t1 - t0)));
const $ = (id) => document.getElementById(id);
const mk = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; };

// postavi transformaciju / prozirnost / zamućenje elementa
function S(el, o) {
  const x = o.x || 0, y = o.y || 0, z = o.z || 0, s = o.s == null ? 1 : o.s;
  const sx = o.sx == null ? s : o.sx, sy = o.sy == null ? s : o.sy;
  let tr = `translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,${z.toFixed(2)}px)`;
  if (o.rx) tr += ` rotateX(${o.rx.toFixed(3)}deg)`;
  if (o.ry) tr += ` rotateY(${o.ry.toFixed(3)}deg)`;
  if (o.r) tr += ` rotateZ(${o.r.toFixed(3)}deg)`;
  if (o.skx) tr += ` skewX(${o.skx.toFixed(3)}deg)`;
  tr += ` scale(${sx.toFixed(4)},${sy.toFixed(4)})`;
  el.style.transform = tr;
  if (o.o != null) { el.style.opacity = clamp(o.o).toFixed(4); el.style.visibility = o.o <= 0.002 ? 'hidden' : 'visible'; }

  if (o.br != null) f += `brightness(${o.br.toFixed(3)}) `;

}
const show = (el, on) => { el.style.display = on ? '' : 'none'; };

// deterministički "slučajni" brojevi
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// razbij tekst na riječi s maskom (za "izranjanje" riječi)
function words(parent, segments) {
  const out = [];

    text.split(' ').filter(Boolean).forEach((word, wi, arr) => {
      const w = mk('span', 'w', parent);

}

function tapEl(ph) { const ring = mk('div', 'tap', ph.taps), dot = mk('div', 'tapdot', ph.taps); return { ring, dot }; }

// 1) QR
const qrWrap = mk('div', '', $('phones')); qrWrap.id = 'qrWrap';
qrWrap.innerHTML = `<div id="qrCard"><svg viewBox="0 0 ${QR.n} ${QR.n}" shape-rendering="crispEdges"><path d="${QR.d}" fill="#171310"/></svg><div id="scan"><div class="trail"></div><div class="ln"></div></div></div><div id="qrPing"></div><i class="brk tl"></i><i class="brk tr"></i><i class="brk bl"></i><i class="brk br"></i>`;
const ph1 = phone('ph1', ['assets/scr_menu.jpg']);

const ph2 = phone('ph2', ['assets/scr_menu.jpg']);
const CARD = { x: 16, y: 1050.8, w: 173.4, h: 336.7 };
const ghost = mk('div', 'ghost', ph2.el);

// 3) rezervacija

const taps3 = [tapEl(ph3), tapEl(ph3), tapEl(ph3)];
const nextRing = mk('div', '', ph3.taps); nextRing.style.cssText = 'position:absolute;border:3px solid rgba(255,240,210,.95);border-radius:10px;box-shadow:0 0 24px rgba(214,171,99,.9);opacity:0';
// 4) brend
const ph4L = phone('ph4L', ['assets/scr_onama.jpg']);
const ph4R = phone('ph4R', ['assets/scr_footer.jpg']);
const ph4C = phone('ph4C', ['assets/scr_hero.jpg']);

seal.innerHTML = '<div class="ring"></div><div class="disc"><div class="big">0 %</div><div class="small">provizije</div></div>';

// prednosti
const pt1aWords = words($('pt1a'), [['Prvi mjesec', '']]);

[ph4L, ph4R, ph4C].forEach((ph) => { Object.values(ph.imgs)[0].style.transform = 'none'; });

/* ================= animacija ================= */
function scrollTo(ph, src, off) { const im = ph.imgs[src]; im.style.transform = `translate3d(0,${(-off * K).toFixed(2)}px,0)`; }
function only(ph, src) { for (const [k, im] of Object.entries(ph.imgs)) im.style.visibility = k === src ? 'visible' : 'hidden'; }
function tapAt(tp, t, t0, x, y) {
  const p = pr(t, t0, t0 + 0.5, E.oC), q = pr(t, t0 - 0.06, t0 + 0.3, E.oC);
  const on = t > t0 - 0.06 && t < t0 + 0.55;
  S(tp.ring, { x: x * K, y: y, s: lerp(0.45, 1.55, p), o: on ? (t < t0 ? pr(t, t0 - 0.06, t0) : 1 - p) : 0 });
  S(tp.dot, { x: x * K, y: y, s: lerp(1.15, 0.8, q), o: on ? (t < t0 ? pr(t, t0 - 0.06, t0) * 0.9 : 0.9 * (1 - q)) : 0 });
}
// ulazak mobitela odozdo + izlazak prema gore ("listanje" kroz korake)
function phonePose(t, tin, tout, pose = {}) {
  const pi = pr(t, tin, tin + 0.68, E.oE);
  const po = pr(t, tout, tout + 0.44, E.iC);
  const fl = Math.sin((t - tin) * 1.7) * 6;
  return {
    x: (pose.x || 0) + (1 - pi) * (pose.inX || 0),
    y: (pose.y || 0) + (1 - pi) * 1250 - po * 1400 + fl * pi * (1 - po),
    z: pose.z || 0,
    rx: (1 - pi) * 42 - po * 34 + (pose.rx || 0),
    ry: (pose.ry || 0) * pi + Math.sin((t - tin) * 0.9) * 2.2,
    r: (pose.r || 0) + (1 - pi) * (pose.inR || 0),
    s: (pose.s || 1) * lerp(0.86, 1, pi) * (1 - po * 0.06),
    o: t < tin || t > tout + 0.44 ? 0 : 1,
    b: Math.max(0, Math.sin(Math.PI * clamp((t - tin) / 0.68)) * 3 * (1 - pi) * 2, po * (1 - po) * 22),
    br: pose.br,
  };
}

function renderAt(t) {
  const frame = Math.round(t * 60);

  /* ---- pozadina ---- */
  parts.forEach((p) => {
    const y = ((p.y - t * p.v) % 1920 + 1920) % 1920;
    const x = p.x + Math.sin(t * 0.5 + p.ph) * p.sw;
    const tw = 0.55 + 0.45 * Math.sin(t * p.f + p.ph);

    p.e.style.opacity = (p.a * tw).toFixed(3);
  });
  S($('grid'), { y: (t * 10) % 72 });
  // svjetlosne mrlje prate scene

    let v = keys[0][1];
    for (let i = 1; i < keys.length; i++) { const [tk, val] = keys[i], [tp, pv] = keys[i - 1]; if (t >= tp) v = pv.map((a, j) => lerp(a, val[j], pr(t, Math.max(tp, tk - 0.8), tk, E.ioC))); }

  const b2 = sceneMix([[0, [820, 1360, 1.1, 0.6]], [2.2, [880, 1400, 1.0, 0.45]], [4.6, [200, 380, 0.8, 0.35]], [16.6, [880, 1300, 0.9, 0.5]], [18.6, [180, 520, 0.8, 0.45]]]);
  const b3 = sceneMix([[0, [600, 300, 0.7, 0.0]], [4.6, [880, 1450, 0.9, 0.45]], [16.6, [200, 560, 0.8, 0.4]], [18.6, [900, 1450, 0.8, 0.4]]]);

    el.style.transform = `translate3d(${(b[0] + Math.sin(t * 0.6 + ph) * 40).toFixed(1)}px,${(b[1] + Math.cos(t * 0.5 + ph) * 50).toFixed(1)}px,0) scale(${b[2].toFixed(3)})`;

  // fotografija restorana (art direction sa stranice: siva, kontrastna, prigušena)
  const ph = pr(t, 1.95, 2.55, E.oC) * (1 - pr(t, 4.3, 4.75, E.ioC));

  $('bgPhotoShade').style.opacity = ph.toFixed(3);

  /* ---- kamera (trešnja pri udarcima) ---- */

  [[0.64, 16], [16.66, 12]].forEach(([t0, a]) => {
    if (t >= t0 && t < t0 + 0.4) { const d = t - t0, amp = a * Math.exp(-d * 11); shx += amp * Math.sin(d * 83); shy += amp * Math.cos(d * 71); }
  });
  $('cam').style.transform = `translate3d(${shx.toFixed(2)}px,${shy.toFixed(2)}px,0)`;
  // bljesak
  const fl = Math.max(pr(t, 0.62, 0.66) * (1 - pr(t, 0.66, 1.0, E.oC)), pr(t, 1.4, 1.46) * (1 - pr(t, 1.46, 1.9, E.oC)) * 0.8, pr(t, 16.64, 16.68) * (1 - pr(t, 16.68, 17.05, E.oC)));

  S($('streak'), { x: sx, r: 16, o: st * 0.95 });

  /* ---- 0–2 s: hook ---- */
  {

  {

    s.words.forEach((e, j) => {
      const p = pr(t, tin + 0.04 + j * 0.028, tin + 0.64 + j * 0.028, E.oE);
      const q = pr(t, tout + j * 0.01, tout + 0.3 + j * 0.01, E.iC);

  /* ---- korak 1: QR za stolom ---- */
  {

      S(ph1.fs, { o: pr(t, 6.5, 6.8) });

  /* ---- korak 2: digitalni meni ---- */
  {

  {

  /* ---- korak 4: tvoj brend, bez provizije ---- */
  {
    const vis = t > 13.35 && t < 16.75;

    if (vis) {

  /* ---- 18.5–20 s: završni kadar ---- */
  {
    const vis = t > 18.4;
    ['logoE', 'cta', 'url', 'ctaGlow'].forEach((id) => show($(id), vis));
    if (vis) {
      const L = $('logoE'), mark = L.querySelector('.mark'), word = L.querySelector('.word');

      S($('cta'), { y: (1 - pc) * 70, s: lerp(0.88, 1, pc) * pulse, o: clamp(pc * 2) });

      S($('ctaGlow'), { y: 0, s: lerp(0.6, 1, pc), o: pc * (0.8 + 0.2 * Math.sin(t * 4)) });

      S($('url').querySelector('.ul'), { sx: pr(t, 19.1, 19.6, E.ioC), sy: 1 });

  }
}

window.renderAt = renderAt;

(async () => {

  await Promise.all([...document.images].map((im) => (im.complete ? (im.decode ? im.decode().catch(() => {}) : 0) : new Promise((r) => { im.onload = () => (im.decode ? im.decode().catch(() => {}).then(r) : r()); im.onerror = r; }))));

    const loop = () => { renderAt(((performance.now() - start) / 1000) % 20); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
